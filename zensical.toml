[project]
site_name = "zttp"
site_description = "A sans-IO HTTP/1.1 and HTTP/2 parser for Python with a Zig core."
site_author = "Marcelo Trylesinski"
#site_url = "https://zttp.dev/"
repo_url = "https://github.com/Kludex/zttp"
repo_name = "Kludex/zttp"
copyright = """
Copyright &copy; 2026 zttp
"""

nav = [
  { "zttp" = "index.md" },
  { "Get started" = [
    "usage/install.md",
    "usage/first-steps.md",
  ] },
  { "Using zttp" = [
    "usage/parsing.md",
    "usage/sending.md",
    "usage/http2.md",
    "usage/errors.md",
  ] },
  { "Architecture" = [
    "architecture/overview.md",
    "architecture/sans-io.md",
  ] },
  { "Reference" = [
    "reference/performance.md",
    "reference/api.md",
  ] },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/zap"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Kludex/zttp"

# Auto-generate the API reference from the package + its type stubs (the public
# surface is a Zig C-extension, so Griffe reads zttp/_zttp.pyi for signatures).
# Enables `::: zttp.X` blocks and [`zttp.X`][zttp.X] cross-references.
[project.plugins.mkdocstrings.config]
default_handler = "python"

[project.plugins.mkdocstrings.config.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.config.handlers.python.options]
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
docstring_style = "google"
filters = []
inherited_members = true
# The .pyi stub carries signatures but not docstrings, so members would
# otherwise be hidden; show them on signature alone.
show_if_no_docstring = true
# The public API is a Zig C-extension; force static analysis so Griffe reads
# the signatures from zttp/_zttp.pyi rather than inspecting the opaque .so.
allow_inspection = false
force_inspection = false

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
