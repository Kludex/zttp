name: Publish

on:
  push:
    branches: ["main"]
    tags: ["*"]
  workflow_dispatch:

permissions: {}

jobs:
  build-wheels:
    name: "Wheels on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    # Windows builds each cp3x wheel serially at ~2-4 min apiece; eight of them
    # with a cold Zig cache need more time than the other platforms.
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Zig cross-compiles, but cibuildwheel still needs a native runner per OS
        # to build the manylinux/musllinux containers and the macOS/Windows
        # wheels. aarch64 Linux uses the native ARM runner; macOS arm64 + x86_64
        # build on the arm runner; Windows builds run natively on amd64 and arm64.
        os:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-latest"
          - "windows-latest"
          - "windows-11-vs2026-arm"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # hatch-vcs derives the version from git tags; the default shallow
          # checkout fetches none, so it would stamp a fallback (0.0.1.dev1) onto
          # the wheels and sdist. Fetch the full history + tags for the real version.
          fetch-depth: 0

      # cibuildwheel's build[uv] frontend needs uv on PATH; the manylinux
      # containers ship it, the macOS runner does not.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "wheels-${{ matrix.os }}"
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # hatch-vcs derives the version from git tags; the default shallow
          # checkout fetches none, so it would stamp a fallback (0.0.1.dev1) onto
          # the wheels and sdist. Fetch the full history + tags for the real version.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: success() && github.ref == 'refs/heads/main'

    permissions:
      id-token: write # trusted publishing (OIDC), no API token

    environment:
      name: testpypi
      url: https://test.pypi.org/project/zttp

    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish to TestPyPI
        # main is pushed repeatedly with the same dev version, so check TestPyPI
        # first and skip files that have already been uploaded unchanged.
        run: >-
          uv publish
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: success() && startsWith(github.ref, 'refs/tags/')

    permissions:
      id-token: write # trusted publishing (OIDC), no API token

    environment:
      name: pypi
      url: https://pypi.org/project/zttp

    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish to PyPI
        run: uv publish
