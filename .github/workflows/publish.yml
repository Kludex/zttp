name: Publish

on:
  push:
    branches: ["main"]
    tags: ["*"]
  workflow_dispatch:

permissions: {}

jobs:
  # Production: publish https://zttp.marcelotryle.com on every push to main.
  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: cloudflare
      url: https://zttp.marcelotryle.com

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Build docs
        run: scripts/docs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  build-wheels:
    name: "Wheels on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Zig cross-compiles, but cibuildwheel still needs a native runner per OS
        # to build the manylinux/musllinux containers and the macOS/Windows
        # wheels. aarch64 Linux uses the native ARM runner; macOS arm64 + x86_64
        # build on the arm runner; Windows builds amd64.
        os: ["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # cibuildwheel's build[uv] frontend needs uv on PATH; the manylinux
      # containers ship it, the macOS runner does not.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Build wheels
        uses: pypa/cibuildwheel@d16cc544083d96996f923fc4b318fee3cb14b34e # v3.4.1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "wheels-${{ matrix.os }}"
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: success() && github.ref == 'refs/heads/main'

    permissions:
      id-token: write # trusted publishing (OIDC), no API token

    environment:
      name: testpypi
      url: https://test.pypi.org/project/zttp

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # main is pushed repeatedly with the same dev version; don't fail when
          # that version already exists on TestPyPI.
          skip-existing: true

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: success() && startsWith(github.ref, 'refs/tags/')

    permissions:
      id-token: write # trusted publishing (OIDC), no API token

    environment:
      name: pypi
      url: https://pypi.org/project/zttp

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish to PyPI
        # Pinned by release tag, not bare SHA: this is a Docker action and the
        # runner resolves its published image by the release ref. A SHA pin makes
        # it look up ghcr.io/...:<sha>, which has no manifest ("manifest unknown").
        uses: pypa/gh-action-pypi-publish@release/v1
