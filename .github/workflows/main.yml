name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install

      - name: Run checks
        if: "${{ matrix.os == 'ubuntu-latest' }}"
        run: scripts/check

      - name: Build the Zig core and extension
        run: scripts/build

      - name: Run tests
        run: scripts/test

      - name: Enforce coverage
        run: scripts/coverage

  # Windows can't run the POSIX shell scripts, so build the extension via the
  # hatchling hook (uv sync) and run the test suite directly.
  windows:
    name: "Python ${{ matrix.python-version }} on windows"
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: Install (builds the extension via the hatch hook)
        run: uv sync --all-groups

      - name: Run tests
        run: uv run --no-sync pytest

  # https://github.com/marketplace/actions/alls-green#why
  check:
    name: All green
    if: always()
    needs: [tests, windows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@afee1c1eac2a506084c274e9c02c8e0687b48d9e # v1.2.2
        with:
          jobs: "${{ toJSON(needs) }}"
