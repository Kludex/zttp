name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    # Run the POSIX shell scripts under bash on every OS - GitHub's Windows
    # runners ship Git Bash, and the scripts drive everything through `uv`
    # (never .venv/bin), so the same commands work on Windows, macOS and Linux.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        # 3.15 resolves to the latest prerelease until 3.15.0 final ships.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: "${{ matrix.python-version }}"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install

      - name: Run checks
        if: "${{ matrix.os == 'ubuntu-latest' }}"
        run: scripts/check

      - name: Build the Zig core and extension
        run: scripts/build

      - name: Run tests
        run: scripts/test

      - name: Enforce coverage
        run: scripts/coverage

  # https://github.com/marketplace/actions/alls-green#why
  check:
    name: All green
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@afee1c1eac2a506084c274e9c02c8e0687b48d9e # v1.2.2
        with:
          jobs: "${{ toJSON(needs) }}"
