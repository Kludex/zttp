name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    # Run the POSIX shell scripts under bash on every OS - GitHub's Windows
    # runners ship Git Bash, and the scripts drive everything through `uv`
    # (never .venv/bin), so the same commands work on Windows, macOS and Linux.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install

      - name: Run checks
        if: "${{ matrix.os == 'ubuntu-latest' }}"
        run: scripts/check

      - name: Build the Zig core and extension
        run: scripts/build

      - name: Run tests
        run: scripts/test

      - name: Enforce coverage
        run: scripts/coverage

  # Preview: build the docs for each PR and upload a versioned Cloudflare build,
  # commenting the URL on the PR. Skipped on forks and when the secret is absent.
  docs-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    permissions:
      contents: read
      pull-requests: write

    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Build docs
        run: scripts/docs

      - name: Upload preview to Cloudflare
        id: deploy
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        if: ${{ steps.deploy.outcome == 'success' }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            :book: Docs preview: ${{ steps.deploy.outputs.deployment-url }}
          comment-tag: docs-preview

  # https://github.com/marketplace/actions/alls-green#why
  check:
    name: All green
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@afee1c1eac2a506084c274e9c02c8e0687b48d9e # v1.2.2
        with:
          jobs: "${{ toJSON(needs) }}"
