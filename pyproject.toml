[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.8.0", "ziglang==0.16.0"]
build-backend = "hatchling.build"

[project]
name = "zhttp"
description = "A sans-IO HTTP parser for Python with a Zig core."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Marcelo Trylesinski", email = "marcelotryle@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Zig",
    "Topic :: Internet :: WWW/HTTP",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "ruff",
    "mypy",
]
bench = [
    "httptools",
    "h11",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false  # drop the +<hash> local segment; PyPI rejects it on uploads
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["zhttp"]
artifacts = ["zhttp/*.so"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Ship the sources needed to compile the extension from an sdist.
include = ["zhttp", "src", "build.zig", "build_ext.sh", "hatch_build.py"]

[tool.cibuildwheel]
# Zig comes from the `ziglang` build requirement (build isolation), so no
# system toolchain install is needed. Skip 32-bit, musl, and PyPy: the Zig core
# targets glibc/macOS and CPython only.
build = "cp312-* cp313-* cp314-*"
skip = "*-win* *_i686 *-musllinux_*"
build-frontend = "build[uv]"
test-command = 'python -c "import zhttp; c = zhttp.Connection(zhttp.SERVER); c.receive_data(b\"GET / HTTP/1.1\r\n\r\n\"); assert type(c.next_event()).__name__ == \"Request\""'

[tool.cibuildwheel.linux]
archs = ["auto"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.pytest.ini_options]
addopts = "-rxXs --strict-config --strict-markers"
xfail_strict = true
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["zhttp", "tests"]
branch = true
parallel = true
omit = ["zhttp/_zhttp*"]

[tool.coverage.report]
precision = 2
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP", "RUF100"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["zhttp"]
